name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Linux x86-64, Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: laue-analysis
          environment-file: environment.yml
          auto-activate: false
          conda-remove-defaults: true

      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install --yes valgrind

      - name: Report native build environment
        shell: bash -el {0}
        run: |
          python --version
          # conda-forge c-compiler >= 2.0 provides `cc` on PATH and no longer
          # exports $CC; `cc` is also what the test suite's compiler probe uses.
          cc --version | head -1
          h5cc -showconfig | grep -i "HDF5 Version" || true
          gsl-config --version

      - name: Verify the tree contains no generated artifacts
        shell: bash -el {0}
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(so|o|a|whl|pyc)$|/bin/(peaksearch|pix2qs|euler|reconstructN_[a-z]+)$|egg-info|_build/|^dist/|^build/'; then
            echo "generated artifacts are tracked in Git"; exit 1
          fi
          test ! -e src/lauelab/indexing/bin/liblaue.so

      - name: Install the package from source
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test,docs]' build

      - name: Run the test suite (native required, skip reasons enforced)
        shell: bash -el {0}
        run: python -m pytest -rs --strict-markers --require-native

      - name: Build documentation (warnings are errors)
        shell: bash -el {0}
        run: python -m sphinx -E -W --keep-going -b html docs docs/_build/html

      - name: Build sdist and development wheel
        shell: bash -el {0}
        run: python -m build

      - name: Inspect artifact contents
        shell: bash -el {0}
        run: python .github/scripts/inspect_artifacts.py dist

      - name: Install the development wheel in the Conda environment and smoke-test it
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python -m pip uninstall --yes lauelab
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/.github/scripts/smoke_test.py"

      - name: Prove the native gate fails when liblaue.so is missing
        shell: bash -el {0}
        run: |
          set -euo pipefail
          lib=$(python -c "from importlib import resources; print(resources.files('lauelab.indexing.bin') / 'liblaue.so')")
          mv "$lib" "$lib.bak"
          if python -m pytest -q --require-native tests/test_reconstruct.py; then
            echo "expected --require-native to fail without liblaue.so"; mv "$lib.bak" "$lib"; exit 1
          fi
          mv "$lib.bak" "$lib"
