name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: laue-analysis
          environment-file: environment.yml
          auto-activate-base: false
      - name: Install the package with documentation extras
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[docs]'
      - name: Build HTML (warnings are errors)
        shell: bash -el {0}
        run: python -m sphinx -E -W --keep-going -b html docs docs/_build/html
      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Deploys only from successful main builds. Repository settings must set
    # "GitHub Actions" as the Pages source.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
